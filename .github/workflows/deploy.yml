# 部署 Astro 站点到 GitHub Pages（Hermes 生成）
# 必须先在仓库 Settings -> Pages -> Source 选择 "GitHub Actions"，否则本工作流不会生效
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 本项目锁定 astro 6.1.3 + vite 7.3.1，必须用 pnpm 按 lock 安装，不要用 npm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 必须与本地一致（pnpm 12 才会读取 pnpm-workspace.yaml 的 allowBuilds）
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm build = astro build && npx pagefind --site dist（构建产物 + 站内搜索索引）
      - name: Build
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
